window.bid=add=>{const m=my();if(cur==null||!m)return;const c=lead(cur);if(c&&c.team===m)return;const amt=c?c.amt+add:(add===0?S.base:S.base+add);if(amt>mx(T(m)))return alert('বাজেট/লিমিট পার হয়ে যাচ্ছে');addDoc(collection(db,'bids'),{i:cur,p:S.players[cur],team:m,amt,ts:Date.now()})};

window.next=()=>{const n=S.players.length;for(let k=1;k<=n;k++){const i=((cur==null?-1:cur)+k)%n;if(!isSold(i))return setCur(i)}setCur(null)};
window.pickP=()=>setCur(+$('ps').value);

window.login=()=>{const t=$('lt').value,p=$('lp').value.trim();if(t==='__admin'){if(p!==S.admin)return alert('ভুল PIN');me={role:'admin'}}else{const x=T(t);if(!x||x.pin!==p)return alert('ভুল PIN');me={role:'team',team:t}}localStorage.setItem('me',JSON.stringify(me));location.reload()};

let PLTXT=null,PLO=false;

window.plSave=async()=>{const lines=($('plt').value||'').split('\n').map(x=>x.trim()).filter(Boolean);const L=[],seen=new Set();for(const ln of lines){const a=ln.split(/[,\t|]/).map(x=>x.trim());const n=a[0];if(!n)continue;const k=n.toLowerCase();if(seen.has(k))return alert('একই নাম দুইবার আছে: '+n);seen.add(k);let r=null,ps='';for(const t of a.slice(1)){if(/^\d{2,3}$/.test(t))r=+t;else if(t)ps=t.toUpperCase().slice(0,6)}L.push({n:n.slice(0,40),r,p:ps})}if(L.length<2)return alert('কমপক্ষে ২ জন প্লেয়ার দিন');if(L.length>300)return alert('সর্বোচ্চ ৩০০ জন');if((sold.length||bids.length)&&!confirm('⚠️ অকশন শুরু হয়ে গেছে (বিড/বিক্রি আছে)। এখন লিস্ট বদলালে আগের বিক্রির সাথে প্লেয়ার মিলে যেতে পারে। নিশ্চিত?'))return;try{await setDoc(doc(db,'state','plist'),{list:L,ts:Date.now()});PLTXT=null;alert('✅ সেভ হয়েছে — '+L.length+' জন প্লেয়ার')}catch(e){alert('সেভ হয়নি: '+(e.code||e.message))}};

async function abCnt(){try{const ms=await AB.snb.presence.get();AB.cnt=ms.length;viewers=ms.length;if(isA()){if(peakV===null){const d=await getDoc(doc(db,'visitors','_peak'));peakV=d.exists()?(+d.data().n||0):0}if(viewers>peakV){peakV=viewers;await setDoc(doc(db,'visitors','_peak'),{n:peakV,ts:Date.now()})}}render()}catch(e){}}
function abHB(){abCnt().then(()=>{AB.pendA=true;AB.pendB=true})}
function abPubDoc(){if(!AB.dirty||!AB.lastA||!AB.lastB)return;AB.dirty=false;setDoc(doc(db,'state','pub'),{a:JSON.stringify(AB.lastA),b:JSON.stringify(AB.lastB),t:Date.now()}).catch(()=>{})}
/* --- photo pack (admin builds, viewers read 1-3 docs instead of one per photo) --- */
let packT=null;
function packPics(){if(!ABK||!isA())return;clearTimeout(packT);packT=setTimeout(async()=>{try{const es=Object.entries(PICS).map(([n,img])=>({n,img})),ch=[];let c2=[],sz=0;for(const e of es){const l=e.img.length+e.n.length+30;if(sz+l>600000&&c2.length){ch.push(c2);c2=[];sz=0}c2.push(e);sz+=l}if(c2.length)ch.push(c2);
 for(let k=0;k<ch.length;k++)await setDoc(doc(db,'picpack','c'+k),{e:ch[k],ts:Date.now()});
 let prev=4;try{prev=Math.max(4,+localStorage.getItem('packN')||4)}catch(e){}
 for(let k=ch.length;k<prev;k++)await deleteDoc(doc(db,'picpack','c'+k)).catch(()=>{});
 try{localStorage.setItem('packN',String(Math.max(ch.length,1)))}catch(e){}
 AB.pv=Date.now();AB.pendB=true}catch(e){}},3500)}
async function fetchPack(){try{const s=await getDocs(collection(db,'picpack'));const P={};s.docs.forEach(d=>{const e=d.data().e;if(Array.isArray(e))e.forEach(x=>{if(x&&x.n&&x.img)P[String(x.n).trim().toLowerCase()]=x.img})});PICS=P;render()}catch(e){}}
/* --- viewers: apply bundles --- */
function applyA(a){if(!a||!(a.t>=lastAt))return;lastAt=a.t;if(a.s>=5)SEC=a.s;if(a.v)viewers=a.v;
 const n=a.c==null?null:a.c,ch=n!==cur;cur=n;bids=(a.B||[]).map((x,k)=>({id:'a'+k,i:n,p:S.players[n]||'',team:x[0],amt:x[1],ts:x[2]}));
 if(curInit&&ch&&n!=null)showReveal(n);curInit=true;adm();render()}
function applyB(b){if(!b||!(b.t>=lastBt))return;lastBt=b.t;const old=new Set(sold.map(x=>x.i));
 sold=(b.S||[]).map(r=>({id:String(r[0]),i:r[0],p:r[1],team:r[2],amt:r[3],ts:r[4]}));
 if(Array.isArray(b.pl)&&b.pl.length>=2){PLRAW=b.pl;S.players=b.pl.map(x=>x.n);Object.keys(INFO).forEach(k=>delete INFO[k]);b.pl.forEach(x=>{if(x.r||x.p)INFO[String(x.n).toLowerCase()]={pos:x.p||'',rate:x.r||''}})}
 FANS=b.f||{};BCM=b.bc||{};BTM=b.bt||{};
 if(soldInit)sold.forEach(x=>{if(old.has(x.i))return;const k=x.id+'|'+x.team+'|'+x.amt+'|'+(x.ts||'');if(shownS.has(k))return;shownS.add(k);showSold(x)});
 soldInit=true;if(b.pv&&b.pv!==AB.pv){AB.pv=b.pv;fetchPack()}tkui();adm();render()}
async function loadPub(){try{const d=await getDoc(doc(db,'state','pub'));if(!d.exists())return;const v=d.data();if(v.a)applyA(JSON.parse(v.a));if(v.b)applyB(JSON.parse(v.b))}catch(e){}}
function showOff(v){let e=$('ofl');if(!e){e=document.createElement('div');e.id='ofl';e.textContent='⚠ লাইভ আপডেট আসতে দেরি হচ্ছে… অপেক্ষা করুন';document.body.appendChild(e)}e.style.display=v?'block':'none'}
/* --- reactions through Ably --- */
window.rxSend=o=>{const n=Date.now();if(!ABK)return addDoc(collection(db,'reacts'),{...o,ts:n});AB.mine.push([n,o]);AB.mine=AB.mine.filter(x=>x[0]>n-9000);
 if(isA()&&AB.pubOK){rxAdd(o);return Promise.resolve()}
 return AB.rx?AB.rx.publish('r',o).catch(()=>{}):Promise.resolve()};
function rxAdd(o){if(!o)return;if(o.e&&EMO.includes(o.e)){AB.xe[o.e]=(AB.xe[o.e]||0)+1;AB.pendX=true}else if(o.m!=null&&PM[+o.m]&&AB.xm.length<6){AB.xm.push([+o.m,String(o.f||'').slice(0,20)]);AB.pendX=true}}
function rxAgg(d){if(!d)return;const mine=AB.mine.filter(x=>x[0]>Date.now()-9000);
 Object.entries(d.e||{}).forEach(([e,n])=>{let k=mine.filter(x=>x[1].e===e).length;n=Math.max(0,n-k);for(let j=0;j<Math.min(n,4);j++)setTimeout(()=>fly(e),j*250)});
 (d.m||[]).forEach(([k,f],j)=>{const i=mine.findIndex(x=>x[1].m===k);if(i>=0){mine.splice(i,1);return}setTimeout(()=>rxIn({m:k,f}),j*400)})}
/* --- start --- */
async function abInit(){if(!ABK)return;
 if(LM){loadPub();fetchPack();setInterval(()=>{const idle=Date.now()-AB.lastMsg;showOff(idle>45000);if(idle>45000&&Date.now()-AB.lastPoll>20000){AB.lastPoll=Date.now();loadPub()}},5000)}
 try{await loadAbly()}catch(e){AB.st='লাইব্রেরি লোড হয়নি';abUI();return}
 let root='';try{root=isA()?(localStorage.getItem('ablyRoot')||''):''}catch(e){}
 AB.pubOK=!!root;
 try{AB.rt=new Ably.Realtime({key:root||ABK,clientId:'c'+VID.slice(0,8)+(isA()?'A':me?'M':'V')+Math.random().toString(36).slice(2,6)});
  AB.snb=AB.rt.channels.get('snb');AB.rx=AB.rt.channels.get('rx');
  AB.rt.connection.on(c=>{AB.st=c.current;abUI();if(c.current==='connected')AB.snb.presence.enter({r:isA()?'a':me?'m':'v'}).catch(()=>{})});
  AB.snb.subscribe('x',m=>rxAgg(m.data));
  if(LM){AB.snb.subscribe('a',m=>{AB.lastMsg=Date.now();applyA(m.data)});AB.snb.subscribe('b',m=>{AB.lastMsg=Date.now();applyB(m.data)})}
  else if(!isA())AB.snb.subscribe('a',m=>{const d=m.data;if(d&&d.v){viewers=d.v;render()}});
  if(isA()&&AB.pubOK){AB.rx.subscribe('r',m=>rxAdd(m.data));setInterval(abFlush,400);setInterval(abHB,20000);setInterval(abPubDoc,8000);setTimeout(abHB,2500)}
  else if(isA())setInterval(abCnt,20000)
 }catch(e){AB.st='ত্রুটি: '+(e.message||e)}
 if(isA()&&navigator.wakeLock){const wl=()=>navigator.wakeLock.request('screen').catch(()=>{});wl();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wl()})}}
abInit();
if(!isA())$('join').style.display='flex';
lg();adm();render();
</script></body></html>
