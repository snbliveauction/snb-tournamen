:root{--bg:#070b1a;--c:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#eef1ff;--mu:#94a0c4;--g:#f5c451;--a:#7c5cff;--ok:#34d399;--no:#f87171}

const ini=n=>(String(n).trim()[0]||'?').toUpperCase(),hue=n=>[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const okImg=i=>typeof i==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(i);
const ava=(p,img,sz)=>okImg(img)?'<img class="av" style="width:'+sz+'px;height:'+sz+'px" src="'+img+'" alt="">':'<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.45)+'px;background:linear-gradient(135deg,hsl('+hue(p)+' 60% 45%),hsl('+((hue(p)+40)%360)+' 60% 28%))">'+esc(ini(p))+'</span>';
const logoOf=n=>{const u=LGS[n];if(okImg(u))return u;const l=LOGO.find(x=>x[0].test(n));return l?l[1]:''};
const crest=(n,sz)=>{const l=logoOf(n);return l?'<img class="cr" style="height:'+sz+'px" src="'+l+'" alt="">':'<span class="av" style="width:'+sz+'px;height:'+sz+'px;border-radius:8px;font-size:'+Math.round(sz*.45)+'px;background:linear-gradient(135deg,hsl('+hue(n)+' 55% 42%),hsl('+((hue(n)+40)%360)+' 55% 28%))">'+esc(ini(String(n).replace(/^team\s+/i,'')))+'</span>'};
const photoOf=p=>{const a=M.filter(m=>m.mom&&String(m.mom.p).toLowerCase()===String(p).toLowerCase()&&okImg(m.mom.img)).sort((x,y)=>(y.ts||0)-(x.ts||0))[0];return a?a.mom.img:''};
const TABS=[['home','🏠 হোম'],['table','📊 টেবিল'],['matches','⚽ ম্যাচ'],['submit','📝 রেজাল্ট'],['stats','🏅 স্ট্যাটস'],['records','🏛 রেকর্ড'],['admin','🔐 অ্যাডমিন']];
const teams=()=>T.length?T:[...new Set(SO.map(x=>x.team))];
const roster=t=>CR[t]&&CR[t].length?CR[t]:SO.filter(x=>x.team===t).map(x=>x.p);
const win=m=>m.hs>m.as?m.h:m.hs<m.as?m.a:(m.pw||null);
const L={league:'লীগ',sf:'সেমিফাইনাল',final:'ফাইনাল'};
function table(){const r={};teams().forEach(n=>r[n]={n,p:0,w:0,d:0,l:0,f:0,a:0,pt:0,fm:[]});M.filter(m=>m.stage==='league'&&m.st==='done').sort((x,y)=>(x.ts||0)-(y.ts||0)).forEach(m=>{const h=r[m.h],a=r[m.a];if(!h||!a)return;const hs=+m.hs,as=+m.as;h.p++;a.p++;h.f+=hs;h.a+=as;a.f+=as;a.a+=hs;const k=hs>as?['W','L',3,0]:hs<as?['L','W',0,3]:['D','D',1,1];h.fm.push(k[0]);a.fm.push(k[1]);h.pt+=k[2];a.pt+=k[3];h[k[0].toLowerCase()]++;a[k[1].toLowerCase()]++});return Object.values(r).sort((x,y)=>y.pt-x.pt||(y.f-y.a)-(x.f-x.a)||y.f-x.f||x.n.localeCompare(y.n))}
function stats(){const P={};let last=null;const g=(p,t)=>P[p+'|'+t]||(P[p+'|'+t]={p,t,m:0,img:'',ts:0});M.filter(m=>m.mom&&m.mom.p).sort((x,y)=>(x.ts||0)-(y.ts||0)).forEach(m=>{const x=g(m.mom.p,m.mom.t);x.m++;x.ts=m.ts||0;if(okImg(m.mom.img))x.img=m.mom.img;last={p:m.mom.p,t:m.mom.t,img:okImg(m.mom.img)?m.mom.img:'',m}});if(last&&!last.img)last.img=photoOf(last.p);Object.values(P).forEach(x=>{if(!x.img)x.img=photoOf(x.p)});return{P:Object.values(P),last}}
const top=(a,k,n=5)=>[...a].filter(x=>x[k]>0).sort((x,y)=>y[k]-x[k]).slice(0,n);
const lst=(t,a,k,u)=>'<div class="c"><h3>'+t+'</h3>'+(a.length?a.map((x,i)=>'<div class="row"><span>'+(['🥇','🥈','🥉'][i]||i+1+'.')+' <b>'+esc(x.p)+'</b> <span class="mu">'+esc(x.t)+'</span></span><b style="color:var(--g)">'+x[k]+' '+u+'</b></div>').join(''):'<div class="mu">এখনো ডেটা নেই</div>')+'</div>';

window.clearAll=async()=>{if(!confirm('সব ম্যাচ, নোটিশ ও টিম সেটআপ মুছে যাবে। নিশ্চিত?'))return;const b=writeBatch(db);M.forEach(m=>b.delete(doc(db,'t_matches',m.id)));N.forEach(n=>b.delete(doc(db,'t_notices',n.id)));b.delete(doc(db,'t_cfg','main'));await b.commit();ed=null;alert('সব মুছে গেছে')};
window.genFix=async()=>{const t=teams();if(t.length<2)return alert('আগে টিম সেভ করুন');if(M.some(m=>m.stage==='league')&&!confirm('লীগ ম্যাচ আগে থেকেই আছে। আবার তৈরি করলে একই আইডির ম্যাচ মুছে যাবে। এগিয়ে যাবেন?'))return;const a=[...t];if(a.length%2)a.push(null);const n=a.length,b=writeBatch(db);let k=0;for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){let h=a[i],w=a[n-1-i];if(h==null||w==null)continue;if((r+i)%2)[h,w]=[w,h];k++;b.set(doc(db,'t_matches','L'+String(k).padStart(2,'0')),{h,a:w,hs:0,as:0,st:'up',stage:'league',rd:r+1,ts:Date.now()+k})}a.splice(1,0,a.pop())}await b.commit();alert(k+'টি ম্যাচ, '+(n-1)+' রাউন্ডে (প্রতি রাউন্ডে সব টিম একবার করে) তৈরি হয়েছে')};
window.genSF=async()=>{const t=table();if(t.length<4)return alert('কমপক্ষে ৪টি টিম লাগবে');if(M.filter(m=>m.stage==='league'&&m.st!=='done').length&&!confirm('সব লীগ ম্যাচ এখনো শেষ হয়নি। তবুও তৈরি করবেন?'))return;await setDoc(doc(db,'t_matches','SF1'),{h:t[0].n,a:t[3].n,hs:0,as:0,st:'up',stage:'sf',ts:Date.now()});await setDoc(doc(db,'t_matches','SF2'),{h:t[1].n,a:t[2].n,hs:0,as:0,st:'up',stage:'sf',ts:Date.now()+1});alert('সেমিফাইনাল তৈরি হয়েছে')};
window.genFin=async()=>{const a=M.find(m=>m.id==='SF1'),b=M.find(m=>m.id==='SF2');if(!a||!b||a.st!=='done'||b.st!=='done'||!win(a)||!win(b))return alert('দুটি সেমিফাইনাল শেষ করে বিজয়ী ঠিক করুন (ড্র হলে পেনাল্টি বিজয়ী দিন)');await setDoc(doc(db,'t_matches','FIN'),{h:win(a),a:win(b),hs:0,as:0,st:'up',stage:'final',ts:Date.now()});alert('ফাইনাল তৈরি হয়েছে')};
const fit=(file,px=240)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),sy=(i.height-s)*.2,c=document.createElement('canvas');c.width=c.height=px;c.getContext('2d').drawImage(i,(i.width-s)/2,sy,s,s,0,0,px,px);res(c.toDataURL('image/jpeg',.82))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
window.momPhoto=async inp=>{const f=inp.files&&inp.files[0];if(!f)return;try{sync();const pv=$('ep').value,tv=$('et').value;pend=await fit(f);if(ed&&ed.mom&&ed.mom.p){ed.mom.img=pend;pend='';await setDoc(doc(db,'t_matches',ed.id),{mom:ed.mom},{merge:true})}dr(1);$('et').value=tv;fillPl();$('ep').value=pv}catch(e){alert('ছবি পড়া যায়নি, আরেকটা ছবি দিন')}};
window.rmMom=async()=>{sync();ed.mom=null;pend='';try{await setDoc(doc(db,'t_matches',ed.id),{mom:null},{merge:true})}catch(e){}dr(1)};
const err=e=>console.error(e);
onSnapshot(doc(db,'t_cfg','main'),s=>{T=s.exists()?s.data().teams||[]:[];CR=s.exists()?s.data().roster||{}:{};LGS=s.exists()?s.data().logos||{}:{};{const q=s.exists()?s.data():{};CFG={gpm:+q.gpm||0,smode:q.smode||'goals',minG:+q.minG||1,pos:q.pos||{}}}mg();dr()},err);
onSnapshot(collection(db,'t_games'),s=>{GM=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));mg();dr()},err);
onSnapshot(collection(db,'t_matches'),s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));mg();dr()},err);
onSnapshot(collection(db,'t_records'),s=>{RC=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));dr()},err);
onSnapshot(collection(db,'t_notices'),s=>{N=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts);dr()},err);
onSnapshot(collection(db,'sold'),s=>{SO=s.docs.map(d=>d.data());dr()},err);
onAuthStateChanged(au,u=>{U=u;dr(1)});
$('hl').src=SNB_LOGO;
draw();
